<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital de Clínicas - Traslado 1</title>
  <link rel="stylesheet" href="../CSS/main.css">
  <link rel="stylesheet" href="../CSS/traslado.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="#">
  <script src="../JS/main.js" defer></script>
</head>
<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="app-shell">

    <header class="topbar">
      <button type="button" class="topbar-action menu-action" aria-label="Abrir menú">
        <img src="../Elements/Icons/hamburger-menu.svg" alt="" class="menu-icon-img">
      </button>

      <div class="brand">
        <img src="../Elements/Icons/hospital-logo.png" alt="Hospital de Clínicas">
        <span>HOSPITAL DE CLINICAS</span>
      </div>

      <button type="button" class="topbar-action search-action" aria-label="Buscar">
        <img src="../Elements/Icons/search-icon.svg" alt="" aria-hidden="true">
      </button>
    </header>


    <section class="traslado-wrapper">
      <article class="traslado-card">
        

        <button type="button" class="btn-close" aria-label="Cerrar">&times;</button>


        <div class="ambulance-icon-container">
          <img src="../Elements/Icons/location-icon.svg" alt="Ícono de Ambulancia" class="ambulance-icon">
        </div>

        <h1 class="traslado-title">TRASLADO 1</h1>

    
        <div class="traslado-body">
          

          <div class="map-column">
            <span class="map-label">Rastreo en Vivo:</span>
            <div class="map-container">
        
              <img src="../Elements/mapa-placeholder.png" alt="Mapa de rastreo en vivo del traslado" class="map-image">
            </div>
          </div>


          <div class="info-column">
            
            <div class="info-group">
              <p><strong>Conductor:</strong> Benjamín Genolet</p>
              <p><strong>Acompañante:</strong> Nicolás Peluffo</p>
              <p><strong>Elemento:</strong> PACIENTE</p>
            </div>

            <div class="info-group">
              <p><strong>Origen:</strong> Hospital</p>
              <p><strong>Destino:</strong> ITSP</p>
            </div>

            <div class="info-group">
              <p><strong>Hora de Inicio:</strong> 22:32 PM</p>
              <p><strong>Hora Final:</strong> 2:22 AM</p>
            </div>

            <div class="info-group">
              <p><strong>Fecha de Realización:</strong> 12/02/2026</p>
            </div>

          </div>

        </div>

      </article>
    </section>
  </main>


  <div class="profile-wrapper" id="contenedor-perfil">
    <button type="button" class="profile-button" aria-label="Perfil de usuario" onclick="toggleMenu()"></button>
  </div>
</body>
</html>
