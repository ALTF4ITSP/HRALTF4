<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuestas</title>
  <link rel="stylesheet" href="../css/main-menu.css?v=20260927-brand-fix">
  <link rel="stylesheet" href="../css/survey.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/main-menu.js?v=20260927-global" defer></script>
  <script src="../js/universal-search.js?v=20260927-global" defer></script>
  <script src="../js/surveys.js" defer></script>
</head>

<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="app-shell">
    <aside class="sidebar">
      <button type="button" class="sidebar-action" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="sidebar-nav">
        <div class="nav-indicator"></div>

        <a href="main-menu.html" class="nav-item">
          <img src="../imagenes/house-icon.svg" alt="Inicio">
          <span>Inicio</span>
        </a>
        <a href="documents.html" class="nav-item">
          <img src="../imagenes/folder-icon.svg" alt="Documentos">
          <span>Documentos</span>
        </a>
        <a href="trace.html" class="nav-item">
          <img src="../imagenes/location-icon.svg" alt="Ambulancias">
          <span>Ambulancias</span>
        </a>
        <a href="calendar.html" class="nav-item">
          <img src="../imagenes/calendar-icon.svg" alt="Calendario">
          <span>Calendario</span>
        </a>
        <a href="#" class="nav-item active">
          <img src="../imagenes/survey-icon.svg" alt="Encuestas">
          <span>Encuestas</span>
        </a>
        <a href="management.html" class="nav-item">
          <img src="../imagenes/database-cog.svg" alt="Gestion">
          <span>Gestion</span>
        </a>

        <div class="nav-spacer"></div>

        <a href="settings.html" class="nav-item">
          <img src="../imagenes/settings-icon.svg" alt="Configuración">
          <span>Configuración</span>
        </a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="brand">
        <img src="../imagenes/hospital-logo.png" alt="Hospital de Clínicas">
        <span>HOSPITAL DE CLINICAS</span>
      </div>

      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Buscar encuesta...">
        <button type="button" class="topbar-action search-action" aria-label="Buscar">
          <img src="../imagenes/search-icon.svg" alt="" aria-hidden="true">
        </button>
      </div>
    </header>

    <section class="hero-panel surveys-panel">
      <div class="surveys-heading">
        <div class="hero-copy">
          <h1>Encuestas</h1>
          <p>Gestión y seguimiento de encuestas a pacientes.</p>
        </div>
        <a href="survey-new.html" class="survey-button">+ Nueva encuesta</a>
      </div>

      <div class="survey-stats">
        <article class="survey-surface stat-card">
          <img src="../imagenes/document-icon.svg" alt="" aria-hidden="true">
          <div>
            <p>Encuestas totales</p>
            <strong id="statTotal">0</strong>
          </div>
        </article>
        <article class="survey-surface stat-card">
          <img src="../imagenes/available-icon.svg" alt="" aria-hidden="true">
          <div>
            <p>Activas</p>
            <strong id="statActive">0</strong>
          </div>
        </article>
        <article class="survey-surface stat-card">
          <img src="../imagenes/person-icon.svg" alt="" aria-hidden="true">
          <div>
            <p>Respuestas recibidas</p>
            <strong id="statAnswers">0</strong>
          </div>
        </article>
      </div>

      <section class="survey-surface survey-list" aria-labelledby="list-title">
        <div class="survey-list-heading">
          <h2 id="list-title">Todas las encuestas</h2>
          <select id="statusFilter" class="survey-select" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="ACTIVA">Activa</option>
            <option value="BORRADOR">Borrador</option>
            <option value="FINALIZADA">Finalizada</option>
          </select>
        </div>

        <div class="survey-table" id="surveyTable"></div>
      </section>
    </section>
  </main>
</body>

</html>
