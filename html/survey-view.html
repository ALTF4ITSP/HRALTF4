<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta</title>
  <link rel="stylesheet" href="../css/main-menu.css?v=20260927-brand-fix">
  <link rel="stylesheet" href="../css/survey.css">
  <link rel="stylesheet" href="../css/survey-view.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/surveys.js" defer></script>
  <script src="../js/survey-view.js" defer></script>
</head>

<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="answer-shell">
    <header class="answer-brand">
      <img src="../imagenes/hospital-logo.png" alt="">
      <span>HOSPITAL DE CLINICAS</span>
    </header>

    <section class="survey-surface answer-card">
      <p class="answer-kicker">Encuesta de satisfacción</p>
      <h1 id="surveyTitle"></h1>
      <p class="answer-description" id="surveyDescription"></p>

      <!-- Preguntas -->
      <div id="questionStep">
        <div class="answer-progress-text">
          <span id="progressLabel"></span>
          <span id="progressPercent"></span>
        </div>
        <div class="answer-progress"><span id="progressBar"></span></div>

        <h2 id="questionText"></h2>
        <div id="answerOptions" class="answer-options"></div>
        <p class="answer-message" id="answerMessage" role="status" aria-live="polite"></p>

        <div class="answer-actions">
          <button type="button" id="prevButton" class="survey-button secondary">← Anterior</button>
          <button type="button" id="nextButton" class="survey-button">Siguiente →</button>
        </div>
      </div>

      <!-- Final -->
      <div id="doneStep" class="answer-done" hidden>
        <img src="../imagenes/available-icon.svg" alt="" aria-hidden="true">
        <h2>¡Gracias por responder!</h2>
        <p>Tu opinión nos ayuda a mejorar la calidad de atención.</p>
        <a href="surveys.html" class="survey-button secondary">Volver a encuestas</a>
      </div>
    </section>

    <p class="answer-footer">Tus respuestas son anónimas y confidenciales.</p>
  </main>
</body>

</html>
