<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/settings.css?v=20260927-global">
    <script src="../js/settings.js" defer></script>
  <script src="../js/menu.js" defer></script>
  <script src="../js/idioma.js" defer></script>
</head>

<body>

  <header class="barra">
    <button type="button" class="boton-menu" aria-label="Abrir menú">☰</button>
    <a href="main-menu.html" class="marca"><img src="../imagenes/hospital-logo.png" alt=""> <span>Hospital de Clínicas</span></a>
    <div class="buscador-general">
      <input type="search" id="buscadorGeneral" placeholder="Buscar una sección..." aria-label="Buscar una sección">
      <ul id="resultadosGenerales" hidden></ul>
    </div>
    <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </header>

  <div class="pagina">
    <nav class="menu">
      <a href="main-menu.html"><img src="../imagenes/house-icon.svg" alt=""> Inicio</a>
      <a href="documents.html"><img src="../imagenes/folder-icon.svg" alt=""> Documentos</a>
      <a href="trace.html"><img src="../imagenes/location-icon.svg" alt=""> Ambulancias</a>
      <a href="calendar.html"><img src="../imagenes/calendar-icon.svg" alt=""> Calendario</a>
      <a href="surveys.html"><img src="../imagenes/survey-icon.svg" alt=""> Encuestas</a>
      <a href="management.html"><img src="../imagenes/database-cog.svg" alt=""> Gestión</a>
      <div class="separador"></div>
      <a href="settings.html" class="activo"><img src="../imagenes/settings-icon.svg" alt=""> Configuración</a>
      <a href="../php/logout.php"><img src="../imagenes/logout-icon.svg" alt=""> Cerrar sesión</a>
    </nav>

    <main class="contenido">

        <section class="content-card">
            <section class="bg-panel">
                <header class="settings-header">
                    <div class="settings-heading">
                        <h1>Configuración</h1>

                        <div class="settings-tabs" role="tablist" aria-label="Secciones de configuración">
                            <button type="button" class="settings-tab active" id="general-tab" role="tab"
                                aria-selected="true" aria-controls="general-panel" data-tab="general-panel">
                                Información General
                            </button>
                            <button type="button" class="settings-tab" id="privacy-tab" role="tab" aria-selected="false"
                                aria-controls="privacy-panel" data-tab="privacy-panel">
                                Idioma y contraseña
                            </button>
                        </div>
                    </div>

                    <button type="button" class="user-control" aria-label="Abrir opciones de usuario">
                        <span class="user-avatar" aria-hidden="true">
                            <img src="../imagenes/person-icon.svg" alt="Usuario">
                        </span>
                        <span class="user-name">Usuario</span>
                        <span class="user-arrows" aria-hidden="true">
                            <span>▲</span>
                            <span>▼</span>
                        </span>
                    </button>
                </header>

                <div class="settings-panels">
                    <section class="settings-panel general-panel" id="general-panel" role="tabpanel"
                        aria-labelledby="general-tab">

                        <div class="general-details">
                            <div class="settings-row">
                                <div class="settings-field">
                                    <label for="settings-name">Nombre</label>
                                    <input id="settings-name" type="text" maxlength="100" placeholder="Nombre...">
                                </div>

                                <div class="settings-field">
                                    <label for="settings-lastname">Apellido</label>
                                    <input id="settings-lastname" type="text" maxlength="100" placeholder="Apellido...">
                                </div>
                            </div>

                            <div class="settings-field">
                                <label for="settings-email">Email</label>
                                <input id="settings-email" type="email" maxlength="150" placeholder="Email...">
                            </div>

                            <div class="settings-row">
                                <div class="settings-field">
                                    <label for="settings-role">Cargo (rol)</label>
                                    <input id="settings-role" type="text" maxlength="100" placeholder="Ej. Enfermero..."
                                        list="role-options">
                                </div>

                                <div class="settings-field">
                                    <label for="settings-sector">Sector</label>
                                    <input id="settings-sector" type="text" maxlength="100" placeholder="Ej. Emergencia..."
                                        list="sector-options">
                                </div>
                            </div>


                            <div class="settings-field">
                                <label for="settings-username">Nombre de usuario</label>
                                <input id="settings-username" type="text" minlength="6" maxlength="50"
                                    autocomplete="username" placeholder="Usuario...">
                            </div>

                            <div class="settings-field">
                                <label for="settings-center">Centro</label>
                                <input id="settings-center" type="text" maxlength="150" placeholder="Hospital de Clínicas...">
                            </div>

                            <!-- Sugerencias: se puede elegir una o escribir otra -->
                            <datalist id="role-options">
                                <option value="Administrativo"></option>
                                <option value="Chofer"></option>
                                <option value="Enfermero"></option>
                                <option value="Médico"></option>
                                <option value="Gestor"></option>
                            </datalist>
                            <datalist id="sector-options">
                                <option value="Documentación"></option>
                                <option value="Emergencia"></option>
                                <option value="Traslados"></option>
                                <option value="Clínica"></option>
                                <option value="Laboratorio"></option>
                            </datalist>

                            <p class="settings-status" id="profileStatus" role="status" aria-live="polite"></p>

                            <div class="specialties-group">
                                <p>Especializaciones</p>
                                <div class="specialty-list">
                                    <button type="button" class="specialty-add"
                                        aria-label="Agregar especialización">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="general-divider" aria-hidden="true"></div>

                        <div class="profile-settings">
                            <p class="section-label">Foto de Perfil</p>

                            <button type="button" class="upload-box">
                                <img class="photo-preview" id="photoPreview" alt="Tu foto de perfil" hidden>
                                <span class="upload-icon" aria-hidden="true">
                                    <img src="../imagenes/camera-icon.svg" alt="Subir Imagen">
                                </span>
                                <span class="upload-text">SUBIR IMAGEN</span>
                            </button>
                        </div>
                    </section>

                    <section class="settings-panel privacy-panel" id="privacy-panel" role="tabpanel"
                        aria-labelledby="privacy-tab" hidden>

                        <div class="privacy-options">

                            <div class="select-setting">
                                <label for="settings-language">Idioma</label>
                                <select id="settings-language">
                                    <option value="es">Español</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                        </div>

                        <form class="password-setting" id="passwordForm">
                            <p>Cambiar Contraseña</p>

                            <div class="settings-field">
                                <label for="password-current">Contraseña actual</label>
                                <input id="password-current" name="contrasena_actual" type="password"
                                    autocomplete="current-password" required>
                            </div>

                            <div class="settings-field">
                                <label for="password-new">Contraseña nueva</label>
                                <input id="password-new" name="contrasena_nueva" type="password" minlength="8"
                                    autocomplete="new-password" required>
                            </div>

                            <div class="settings-field">
                                <label for="password-repeat">Repetir contraseña nueva</label>
                                <input id="password-repeat" name="contrasena_repetida" type="password" minlength="8"
                                    autocomplete="new-password" required>
                            </div>

                            <p class="settings-hint">Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.</p>
                            <p class="settings-status" id="passwordStatus" role="status" aria-live="polite"></p>

                            <button type="submit" class="reset-password">Cambiar Contraseña</button>
                        </form>
                    </section>
                </div>
            </section>
        </section>
    </main>
  </div>
</body>

</html>
