<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/calendar.css">
  <link rel="stylesheet" href="../css/buscador.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/buscador.js" defer></script>
  <script src="../js/calendar.js" defer></script>
  <script src="../js/menu.js" defer></script>
  <script src="../js/idioma.js" defer></script>
</head>

<body>

  <header class="barra">
    <button type="button" class="boton-menu" aria-label="Abrir menú">☰</button>
    <a href="main-menu.html" class="marca"><img src="../imagenes/hospital-logo.png" alt=""> <span>Hospital de Clínicas</span></a>
    <div class="buscador-general">
      <input type="search" id="buscadorGeneral" placeholder="Buscar una sección..." aria-label="Buscar una sección">
      <ul id="resultadosGenerales" hidden></ul>
    </div>
    <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </header>

  <div class="pagina">
    <nav class="menu">
      <a href="main-menu.html"><img src="../imagenes/house-icon.svg" alt=""> Inicio</a>
      <a href="documents.html"><img src="../imagenes/folder-icon.svg" alt=""> Documentos</a>
      <a href="trace.html"><img src="../imagenes/location-icon.svg" alt=""> Ambulancias</a>
      <a href="calendar.html" class="activo"><img src="../imagenes/calendar-icon.svg" alt=""> Calendario</a>
      <a href="surveys.html"><img src="../imagenes/survey-icon.svg" alt=""> Encuestas</a>
      <a href="management.html"><img src="../imagenes/database-cog.svg" alt=""> Gestión</a>
      <div class="separador"></div>
      <a href="settings.html"><img src="../imagenes/settings-icon.svg" alt=""> Configuración</a>
      <a href="../php/logout.php"><img src="../imagenes/logout-icon.svg" alt=""> Cerrar sesión</a>
    </nav>

    <main class="contenido">

    <section class="hero-panel calendar-panel">
      <div class="calendar-heading">
        <div class="hero-copy">
          <h1>Calendario</h1>
          <p>Turnos de los pacientes. Hacé clic en un horario libre para agendar uno nuevo.</p>
        </div>
        <button type="button" class="cal-button" id="newTurn">+ Nuevo turno</button>
      </div>

      <div class="cal-surface cal-toolbar">
        <div class="cal-nav">
          <button type="button" class="cal-icon-button" id="prevWeek" aria-label="Semana anterior">&#8249;</button>
          <button type="button" class="cal-icon-button" id="nextWeek" aria-label="Semana siguiente">&#8250;</button>
          <button type="button" class="cal-button secondary" id="todayButton">Hoy</button>
        </div>
        <h2 id="weekTitle" aria-live="polite"></h2>
        <ul class="cal-legend" aria-label="Estados de los turnos">
          <li><span class="dot state-programado"></span>Programado</li>
          <li><span class="dot state-atendido"></span>Atendido</li>
          <li><span class="dot state-cancelado"></span>Cancelado</li>
        </ul>
      </div>

      <p class="cal-message" id="calMessage" role="status" hidden></p>

      <div class="cal-surface cal-scroll">
        <div class="cal-grid" id="calendarGrid"></div>
      </div>
    </section>

    <!-- Formulario de turno -->
    <dialog class="cal-dialog" id="turnDialog" aria-labelledby="dialogTitle">
      <form id="turnForm" method="dialog">
        <h2 id="dialogTitle">Nuevo turno</h2>

        <div class="cal-field">
          <label for="turnPatient">Paciente</label>
          <div class="buscador">
            <input type="text" id="turnPatient" placeholder="Buscar por nombre o cédula..." aria-controls="turnPatientList">
            <input type="hidden" name="id_gestion_paciente">
            <ul class="buscador-lista" id="turnPatientList" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="cal-field">
          <label for="turnDoctor">Médico <span>(opcional)</span></label>
          <div class="buscador">
            <input type="text" id="turnDoctor" placeholder="Buscar por nombre o especialidad..." aria-controls="turnDoctorList">
            <input type="hidden" name="id_gestion_medico">
            <ul class="buscador-lista" id="turnDoctorList" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="cal-row">
          <div class="cal-field">
            <label for="turnDate">Fecha</label>
            <input type="date" id="turnDate" name="fecha" required>
          </div>
          <div class="cal-field">
            <label for="turnStart">Desde</label>
            <input type="time" id="turnStart" name="hora_inicio" step="900" required>
          </div>
          <div class="cal-field">
            <label for="turnEnd">Hasta</label>
            <input type="time" id="turnEnd" name="hora_fin" step="900" required>
          </div>
        </div>

        <div class="cal-field">
          <label for="turnReason">Motivo</label>
          <input type="text" id="turnReason" name="motivo" maxlength="200" placeholder="Ej. Control cardiológico" required>
        </div>

        <div class="cal-field">
          <label for="turnState">Estado</label>
          <select id="turnState" name="estado">
            <option value="PROGRAMADO">Programado</option>
            <option value="ATENDIDO">Atendido</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>

        <div class="cal-field">
          <label for="turnNotes">Notas <span>(opcional)</span></label>
          <textarea id="turnNotes" name="notas" maxlength="500" placeholder="Ej. Venir en ayunas"></textarea>
        </div>

        <p class="cal-form-error" id="formError" role="alert"></p>

        <div class="cal-dialog-actions">
          <button type="button" class="cal-button danger" id="deleteTurn" hidden>Eliminar</button>
          <button type="button" class="cal-button secondary" id="cancelTurn">Cancelar</button>
          <button type="submit" class="cal-button">Guardar</button>
        </div>
      </form>
    </dialog>
    </main>
  </div>
</body>

</html>
