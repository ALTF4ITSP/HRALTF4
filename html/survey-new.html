<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva encuesta</title>
  <link rel="stylesheet" href="../css/main-menu.css?v=20260927-brand-fix">
  <link rel="stylesheet" href="../css/survey.css">
  <link rel="stylesheet" href="../css/survey-new.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/main-menu.js?v=20260927-global" defer></script>
  <script src="../js/universal-search.js?v=20260927-global" defer></script>
  <script src="../js/surveys.js" defer></script>
  <script src="../js/survey-new.js" defer></script>
</head>

<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="app-shell">
    <aside class="sidebar">
      <button type="button" class="sidebar-action" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="sidebar-nav">
        <div class="nav-indicator"></div>

        <a href="main-menu.html" class="nav-item">
          <img src="../imagenes/house-icon.svg" alt="Inicio">
          <span>Inicio</span>
        </a>
        <a href="documents.html" class="nav-item">
          <img src="../imagenes/folder-icon.svg" alt="Documentos">
          <span>Documentos</span>
        </a>
        <a href="trace.html" class="nav-item">
          <img src="../imagenes/location-icon.svg" alt="Ambulancias">
          <span>Ambulancias</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <img src="../imagenes/analytics-icon.svg" alt="Reportes">
          <span>Reportes</span>
        </a>
        <a href="calendar.html" class="nav-item">
          <img src="../imagenes/calendar-icon.svg" alt="Calendario">
          <span>Calendario</span>
        </a>
        <a href="surveys.html" class="nav-item active">
          <img src="../imagenes/survey-icon.svg" alt="Encuestas">
          <span>Encuestas</span>
        </a>
        <a href="management.html" class="nav-item">
          <img src="../imagenes/database-cog.svg" alt="Gestion">
          <span>Gestion</span>
        </a>

        <div class="nav-spacer"></div>

        <a href="settings.html" class="nav-item">
          <img src="../imagenes/settings-icon.svg" alt="Configuración">
          <span>Configuración</span>
        </a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="brand">
        <img src="../imagenes/hospital-logo.png" alt="Hospital de Clínicas">
        <span>HOSPITAL DE CLINICAS</span>
      </div>

      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Buscar encuesta...">
        <button type="button" class="topbar-action search-action" aria-label="Buscar">
          <img src="../imagenes/search-icon.svg" alt="" aria-hidden="true">
        </button>
      </div>
    </header>

    <section class="hero-panel surveys-panel">
      <a href="surveys.html" class="back-link">← Volver a encuestas</a>

      <div class="surveys-heading">
        <div class="hero-copy">
          <h1>Nueva encuesta</h1>
          <p>Diseñá y configurá una encuesta para pacientes.</p>
        </div>
      </div>

      <form id="surveyForm" class="survey-form">
        <section class="survey-surface form-card">
          <h2>Información</h2>

          <div class="survey-field">
            <label for="titulo">Título de la encuesta</label>
            <input type="text" id="titulo" maxlength="120" placeholder="Ej. Satisfacción general del paciente" required>
          </div>

          <div class="survey-field">
            <label for="categoria">Categoría</label>
            <select id="categoria" required>
              <option value="">Cargando...</option>
            </select>
          </div>

          <div class="survey-field">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" maxlength="300" placeholder="Queremos conocer tu experiencia..."></textarea>
          </div>
        </section>

        <section class="survey-surface form-card">
          <h2>Preguntas</h2>

          <div id="questionList" class="question-list"></div>

          <button type="button" id="addQuestion" class="add-question">+ Agregar pregunta</button>
        </section>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

        <div class="form-actions">
          <a href="surveys.html" class="survey-button secondary">Cancelar</a>
          <button type="submit" class="survey-button secondary" data-estado="BORRADOR">Guardar borrador</button>
          <button type="submit" class="survey-button" data-estado="ACTIVA">Publicar encuesta</button>
        </div>
      </form>
    </section>
  </main>
</body>

</html>
