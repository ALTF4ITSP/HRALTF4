<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva encuesta</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/survey.css">
  <link rel="stylesheet" href="../css/survey-new.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/surveys.js" defer></script>
  <script src="../js/survey-new.js" defer></script>
  <script src="../js/menu.js" defer></script>
  <script src="../js/idioma.js" defer></script>
</head>

<body>

  <header class="barra">
    <button type="button" class="boton-menu" aria-label="Abrir menú">☰</button>
    <a href="main-menu.html" class="marca"><img src="../imagenes/hospital-logo.png" alt=""> <span>Hospital de Clínicas</span></a>
    <div class="buscador-general">
      <input type="search" id="buscadorGeneral" placeholder="Buscar una sección..." aria-label="Buscar una sección">
      <ul id="resultadosGenerales" hidden></ul>
    </div>
    <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </header>

  <div class="pagina">
    <nav class="menu">
      <a href="main-menu.html"><img src="../imagenes/house-icon.svg" alt=""> Inicio</a>
      <a href="documents.html"><img src="../imagenes/folder-icon.svg" alt=""> Documentos</a>
      <a href="trace.html"><img src="../imagenes/location-icon.svg" alt=""> Ambulancias</a>
      <a href="calendar.html"><img src="../imagenes/calendar-icon.svg" alt=""> Calendario</a>
      <a href="surveys.html" class="activo"><img src="../imagenes/survey-icon.svg" alt=""> Encuestas</a>
      <a href="management.html"><img src="../imagenes/database-cog.svg" alt=""> Gestión</a>
      <div class="separador"></div>
      <a href="settings.html"><img src="../imagenes/settings-icon.svg" alt=""> Configuración</a>
      <a href="../php/logout.php"><img src="../imagenes/logout-icon.svg" alt=""> Cerrar sesión</a>
    </nav>

    <main class="contenido">

    <section class="hero-panel surveys-panel">
      <a href="surveys.html" class="back-link">← Volver a encuestas</a>

      <div class="surveys-heading">
        <div class="hero-copy">
          <h1>Nueva encuesta</h1>
          <p>Diseñá y configurá una encuesta para pacientes.</p>
        </div>
      </div>

      <form id="surveyForm" class="survey-form">
        <section class="survey-surface form-card">
          <h2>Información</h2>

          <div class="survey-field">
            <label for="titulo">Título de la encuesta</label>
            <input type="text" id="titulo" maxlength="120" placeholder="Ej. Satisfacción general del paciente" required>
          </div>

          <div class="survey-field">
            <label for="categoria">Categoría</label>
            <select id="categoria" required>
              <option value="">Cargando...</option>
            </select>
          </div>

          <div class="survey-field">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" maxlength="300" placeholder="Queremos conocer tu experiencia..."></textarea>
          </div>
        </section>

        <section class="survey-surface form-card">
          <h2>Preguntas</h2>

          <div id="questionList" class="question-list"></div>

          <button type="button" id="addQuestion" class="add-question">+ Agregar pregunta</button>
        </section>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

        <div class="form-actions">
          <a href="surveys.html" class="survey-button secondary">Cancelar</a>
          <button type="submit" class="survey-button secondary" data-estado="BORRADOR">Guardar borrador</button>
          <button type="submit" class="survey-button" data-estado="ACTIVA">Publicar encuesta</button>
        </div>
      </form>
    </section>
    </main>
  </div>
</body>

</html>
