      <input type="search" id="buscadorGeneral" placeholder="Buscar una sección..." aria-label="Buscar una sección">
      <ul id="resultadosGenerales" hidden></ul>
    </div>
    <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </header>

  <div class="pagina">
    <nav class="menu">
      <a href="main-menu.html"><img src="../imagenes/house-icon.svg" alt=""> Inicio</a>

    </nav>

    <main class="contenido">

    <section class="hero-panel documentos-panel">
      <a href="documents.html" class="volver">← Volver a documentos</a>
      <h1 id="titulo">Cargando...</h1>

      <div class="visor">
        <!-- El archivo: un PDF se muestra en un iframe y una imagen en un img -->
        <div class="caja archivo" id="archivo"></div>

        <div class="columna">
          <div class="caja">
            <h2>Datos</h2>
            <dl class="datos">
              <dt>Tipo</dt><dd id="tipo">—</dd>
              <dt>Formato</dt><dd id="formato">—</dd>
              <dt>Tamaño</dt><dd id="tamano">—</dd>
              <dt>Subido por</dt><dd id="autor">—</dd>
              <dt>Fecha</dt><dd id="fecha">—</dd>
            </dl>
            <p class="acciones">
              <a class="boton" id="descargar">Descargar</a>
              <a class="boton secundario" id="editar">Editar</a>
              <button type="button" class="boton peligro" id="borrar">Borrar</button>
            </p>
          </div>

          <!-- El QR abre el archivo desde el celular -->
          <div class="caja">
            <h2>Código QR</h2>
            <div id="codigoQr"></div>
            <button type="button" class="boton secundario" id="imprimirQr">Imprimir código QR</button>
          </div>
        </div>
      </div>
    </section>
    </main>
  </div>
