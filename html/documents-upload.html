<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Documento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/documents.css">
  <script src="../js/document-form.js" defer></script>
  <script src="../js/menu.js" defer></script>
  <script src="../js/idioma.js" defer></script>
</head>

<body>

  <header class="barra">
    <button type="button" class="boton-menu" aria-label="Abrir menú">☰</button>
    <a href="main-menu.html" class="marca"><img src="../imagenes/hospital-logo.png" alt=""> <span>Hospital de Clínicas</span></a>
    <div class="buscador-general">
      <input type="search" id="buscadorGeneral" placeholder="Buscar una sección..." aria-label="Buscar una sección">
      <ul id="resultadosGenerales" hidden></ul>
    </div>
    <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </header>

  <div class="pagina">
    <nav class="menu">
      <a href="main-menu.html"><img src="../imagenes/house-icon.svg" alt=""> Inicio</a>
      <a href="documents.html" class="activo"><img src="../imagenes/folder-icon.svg" alt=""> Documentos</a>
      <a href="trace.html"><img src="../imagenes/location-icon.svg" alt=""> Ambulancias</a>
      <a href="calendar.html"><img src="../imagenes/calendar-icon.svg" alt=""> Calendario</a>
      <a href="surveys.html"><img src="../imagenes/survey-icon.svg" alt=""> Encuestas</a>
      <a href="management.html"><img src="../imagenes/database-cog.svg" alt=""> Gestión</a>
      <div class="separador"></div>
      <a href="settings.html"><img src="../imagenes/settings-icon.svg" alt=""> Configuración</a>
      <a href="../php/logout.php"><img src="../imagenes/logout-icon.svg" alt=""> Cerrar sesión</a>
    </nav>

    <main class="contenido">

    <section class="hero-panel documentos-panel">
      <!-- .centrado: el formulario queda en el medio de la página -->
      <div class="centrado">
      <a href="documents.html" class="volver">← Volver a documentos</a>
      <h1 id="titulo">Cargar documento</h1>

      <!-- La misma página sirve para cargar uno nuevo y para editar (documents-upload.html?id=3) -->
      <form id="formulario" class="caja formulario" enctype="multipart/form-data">
        <input type="hidden" name="id_documento">

        <label>Nombre del documento
          <input name="nombre" maxlength="150" placeholder="Ej. Informe médico" required>
        </label>

        <div class="fila">
          <label>Fecha
            <input type="date" name="fecha" required>
          </label>
          <label>Categoría
            <select name="categoria" required>
              <option value="">Elegí una...</option>
              <option value="informe">Informe médico</option>
              <option value="estudio">Estudio de laboratorio</option>
              <option value="administrativo">Documento administrativo</option>
            </select>
          </label>
        </div>

        <label>Descripción
          <textarea name="descripcion" maxlength="1000" rows="3"></textarea>
        </label>

        <label>Archivo <span class="ayuda" id="ayudaArchivo">(PDF, DOCX, JPG o PNG, hasta 10 MB)</span>
          <input type="file" name="archivo" accept=".pdf,.docx,.jpg,.jpeg,.png" required>
        </label>

        <p id="mensaje"></p>
        <div class="acciones">
          <button type="submit" class="boton">Guardar</button>
          <a href="documents.html" class="boton secundario">Cancelar</a>
        </div>
      </form>
      </div>
    </section>
    </main>
  </div>
</body>

</html>
