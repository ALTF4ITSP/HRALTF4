<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar Documento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <link rel="stylesheet" href="../css/main-menu.css?v=20260927-brand-fix">
  <link rel="stylesheet" href="../css/documents.css">
  <script src="../js/main-menu.js?v=20260927-global" defer></script>
  <script src="../js/universal-search.js?v=20260927-global" defer></script>
  <script src="../js/document-form.js" defer></script>
</head>

<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="app-shell">
    <aside class="sidebar">
      <button type="button" class="sidebar-action" aria-label="Abrir menú" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="sidebar-nav">
        <div class="nav-indicator"></div>

        <a href="main-menu.html" class="nav-item">
          <img src="../imagenes/house-icon.svg" alt="Inicio">
          <span>Inicio</span>
        </a>
        <a href="documents.html" class="nav-item active" aria-current="page">
          <img src="../imagenes/folder-icon.svg" alt="Documentos">
          <span>Documentos</span>
        </a>
        <a href="trace.html" class="nav-item">
          <img src="../imagenes/location-icon.svg" alt="Ambulancias">
          <span>Ambulancias</span>
        </a>
        <a href="calendar.html" class="nav-item">
          <img src="../imagenes/calendar-icon.svg" alt="Calendario">
          <span>Calendario</span>
        </a>
        <a href="surveys.html" class="nav-item">
          <img src="../imagenes/survey-icon.svg" alt="Encuestas">
          <span>Encuestas</span>
        </a>
        <a href="management.html" class="nav-item">
          <img src="../imagenes/database-cog.svg" alt="Gestion">
          <span>Gestion</span>
        </a>

        <div class="nav-spacer"></div>

        <a href="settings.html" class="nav-item">
          <img src="../imagenes/settings-icon.svg" alt="Configuración">
          <span>Configuración</span>
        </a>
      </nav>
    </aside>

    <section class="content-card document-content-card">
      <header class="topbar">
        <div class="brand">
          <img src="../imagenes/hospital-logo.png" alt="Hospital de Clínicas">
          <span>HOSPITAL DE CLINICAS</span>
        </div>

        <div class="search-wrapper">
          <input type="search" class="search-input" placeholder="Buscar documento..." autocomplete="off">
          <button type="button" class="topbar-action search-action" aria-label="Buscar" aria-expanded="false">
            <img src="../imagenes/search-icon.svg" alt="" aria-hidden="true">
          </button>
        </div>
      </header>

    <section class="hero-panel documentos-panel">
      <!-- .centrado: el formulario queda en el medio de la página -->
      <div class="centrado">
      <a href="documents.html" class="volver">← Volver a documentos</a>
      <h1 id="titulo">Cargar documento</h1>

      <!-- La misma página sirve para cargar uno nuevo y para editar (documents-upload.html?id=3) -->
      <form id="formulario" class="caja formulario" enctype="multipart/form-data">
        <input type="hidden" name="id_documento">

        <label>Nombre del documento
          <input name="nombre" maxlength="150" placeholder="Ej. Informe médico" required>
        </label>

        <div class="fila">
          <label>Fecha
            <input type="date" name="fecha" required>
          </label>
          <label>Categoría
            <select name="categoria" required>
              <option value="">Elegí una...</option>
              <option value="informe">Informe médico</option>
              <option value="estudio">Estudio de laboratorio</option>
              <option value="administrativo">Documento administrativo</option>
            </select>
          </label>
        </div>

        <label>Descripción
          <textarea name="descripcion" maxlength="1000" rows="3"></textarea>
        </label>

        <label>Archivo <span class="ayuda" id="ayudaArchivo">(PDF, DOCX, JPG o PNG, hasta 10 MB)</span>
          <input type="file" name="archivo" accept=".pdf,.docx,.jpg,.jpeg,.png" required>
        </label>

        <p id="mensaje"></p>
        <div class="acciones">
          <button type="submit" class="boton">Guardar</button>
          <a href="documents.html" class="boton secundario">Cancelar</a>
        </div>
      </form>
      </div>
    </section>
  </main>
</body>

</html>
