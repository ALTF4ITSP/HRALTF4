<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traslados | Hospital de Clínicas</title>
  <link rel="stylesheet" href="../css/main-menu.css?v=20260927-brand-fix">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/buscador.css">
  <link rel="stylesheet" href="../css/trace.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Krub:ital,wght@0,200;0,300;0,400;0,500;1,400;1,500&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="../imagenes/hospital-dark.ico">
  <script src="../js/main-menu.js?v=20260927-global" defer></script>
  <script src="../js/universal-search.js?v=20260927-global" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
  <script src="../js/buscador.js" defer></script>
  <script src="../js/trace.js" defer></script>
</head>

<body>
  <div class="page-background"></div>
  <div class="page-glow"></div>

  <main class="app-shell">
    <aside class="sidebar">
      <button type="button" class="sidebar-action" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="sidebar-nav">
        <div class="nav-indicator"></div>

        <a href="main-menu.html" class="nav-item">
          <img src="../imagenes/house-icon.svg" alt="Inicio">
          <span>Inicio</span>
        </a>
        <a href="documents.html" class="nav-item">
          <img src="../imagenes/folder-icon.svg" alt="Documentos">
          <span>Documentos</span>
        </a>
        <a href="trace.html" class="nav-item active">
          <img src="../imagenes/location-icon.svg" alt="Ambulancias">
          <span>Ambulancias</span>
        </a>
        <a href="analytics.html" class="nav-item">
          <img src="../imagenes/analytics-icon.svg" alt="Reportes">
          <span>Reportes</span>
        </a>
        <a href="calendar.html" class="nav-item">
          <img src="../imagenes/calendar-icon.svg" alt="Calendario">
          <span>Calendario</span>
        </a>
        <a href="surveys.html" class="nav-item">
          <img src="../imagenes/survey-icon.svg" alt="Encuestas">
          <span>Encuestas</span>
        </a>
        <a href="management.html" class="nav-item">
          <img src="../imagenes/database-cog.svg" alt="Gestion">
          <span>Gestion</span>
        </a>

        <div class="nav-spacer"></div>

        <a href="settings.html" class="nav-item">
          <img src="../imagenes/settings-icon.svg" alt="Configuración">
          <span>Configuración</span>
        </a>
      </nav>
    </aside>

    <header class="topbar">
      <div class="brand">
        <img src="../imagenes/hospital-logo.png" alt="Hospital de Clínicas">
        <span>HOSPITAL DE CLINICAS</span>
      </div>

      <div class="search-wrapper">
        <input type="text" class="search-input" placeholder="Buscar...">
        <button type="button" class="topbar-action search-action" aria-label="Buscar">
          <img src="../imagenes/search-icon.svg" alt="" aria-hidden="true">
        </button>
      </div>
    </header>

    <section class="hero-panel traslados-panel">
      <h1>Traslados</h1>

      <div class="traslados-layout">
        <!-- Izquierda: formulario y lista -->
        <div class="traslados-columna">
          <form class="traslados-caja" id="formulario">
            <h2>Nuevo traslado</h2>

            <label>Ruta habitual <small>(opcional, completa origen y destino)</small>
              <select id="ruta"><option value="">Sin ruta</option></select>
            </label>
            <div class="traslados-fila">
              <label>Origen <select name="id_origen" required></select></label>
              <label>Destino <select name="id_destino" required></select></label>
            </div>

            <div class="traslados-fila">
              <label>Ambulancia <select name="id_ambulancia" required></select></label>
              <label>Conductor <select name="id_chofer" required></select></label>
            </div>
            <label>Acompañante <small>(opcional)</small>
              <select name="id_acompanante"></select>
            </label>

            <div class="traslados-campo">
              <label for="paciente">Paciente <small>(opcional, buscar por nombre o cédula)</small></label>
              <div class="buscador">
                <input type="text" id="paciente" placeholder="Escribí el nombre o la cédula">
                <input type="hidden" name="id_gestion_paciente">
                <ul class="buscador-lista" role="listbox" hidden></ul>
              </div>
            </div>
            <label>Elemento <small>(si no es un paciente: muestras, equipos...)</small>
              <input name="elemento" maxlength="150">
            </label>

            <div class="traslados-fila">
              <label>Salida <input type="datetime-local" name="salida_programada" required></label>
              <label>Llegada estimada <input type="datetime-local" name="llegada_estimada"></label>
            </div>
            <label>Notas <small>(opcional)</small>
              <input name="notas" maxlength="300">
            </label>

            <p class="traslados-error" id="error" role="alert"></p>
            <button type="submit" class="traslados-boton">Guardar traslado</button>
          </form>

          <div class="traslados-caja">
            <h2>Lista de traslados</h2>
            <input type="search" id="buscar" placeholder="Buscar por ambulancia, paciente, destino..." aria-label="Buscar traslado">
            <ul class="traslados-lista" id="lista"></ul>
          </div>
        </div>

        <!-- Derecha: mapa -->
        <div class="traslados-caja traslados-mapa-caja">
          <div id="mapa" aria-label="Mapa de traslados"></div>
          <p class="traslados-ayuda" id="ayudaMapa">Elegí un traslado de la lista para verlo en el mapa.</p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
