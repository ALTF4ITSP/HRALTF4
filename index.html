<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="css/log-reg.css">
  <link rel="icon" type="image/x-icon" href="imagenes/hospital-gradient.ico">
  <script src="js/idioma.js" defer></script>
</head>

<body>
  <div class="tarjeta">
    <h1>Inicio de Sesion</h1>

    <form id="loginForm" method="POST" action="php/login.php">
      <input type="text" name="usuario" placeholder="Usuario" required>

      <div class="password-wrapper">
        <input type="password" id="loginContraseña" name="contrasena" placeholder="Contraseña" required>
        <button type="button" id="toggleLoginPasswordBtn" class="btn-toggle-eye">
          <img src="imagenes/eye.svg" id="loginEyeIcon" alt="Mostrar u ocultar contraseña">
        </button>
      </div>

      <p id="loginMessage"></p>

      <button type="submit">Inicio sesion</button>
    </form>

    <p>
      ¿No tienes cuenta?
      <a href="html/register.html">Registrate</a>
    </p>
      <button type="button" class="boton-idioma" id="botonIdioma">EN</button>
  </div>

  <script src="js/login.js"></script>
</body>

</html>
