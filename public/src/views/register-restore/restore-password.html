<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="../../css/login-register/pass-restore.css">
    <link rel="icon" type="image/x-icon" href="../../../assets/hospital-gradient.ico">
</head>

<body>
    <div class="tarjeta">
        <h1>Recuperar Contraseña</h1>
        <p class="texto">
            Ingresá tu email y te enviaremos un enlace
            para restablecer tu contraseña.
        </p>
        <form onsubmit="window.location.href='../../../index.html'; return false;">
            <div class="campo">
                <span>✉️</span>
                <input type="email" placeholder="Email">
            </div>
            <button type="submit">
                Enviar
            </button>
        </form>
        <a href="../../../index.html" class="volver">
            Volver a Inicio de Sesión
        </a>
    </div>
</body>

</html>
